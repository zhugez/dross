[package]
name = "dross"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Conservative disk cleaner for Fedora and WSL: read-only by default, every deletion measured"
license = "MIT"
repository = "https://github.com/zhugez/dross"
keywords = ["cli", "disk", "cleanup", "fedora", "wsl"]
categories = ["command-line-utilities"]

[[bin]]
name = "dross"
path = "src/main.rs"

[dependencies]

[profile.release]
lto = true
strip = true
opt-level = "z"
